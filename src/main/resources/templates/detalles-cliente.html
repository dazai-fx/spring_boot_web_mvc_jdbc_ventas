<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del Cliente</title>
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
</head>
<body>
<div class="container my-5">
    <h1 class="text-center mb-4">Detalles del Cliente</h1>

    <div class="card mx-auto" style="max-width: 600px;">
        <div class="card-body">
            <h5 class="card-title">Cliente ID: <span th:text="${cliente.id}"></span></h5>

            <p><strong>Nombre:</strong> <span th:text="${cliente.nombre}"></span></p>
            <p><strong>Apellidos:</strong> <span th:text="${cliente.apellido1} + ' ' + ${cliente.apellido2}"></span></p>
            <p><strong>Ciudad:</strong> <span th:text="${cliente.ciudad}"></span></p>
            <p><strong>Categoría:</strong> <span th:text="${cliente.categoria}"></span></p>

            <div class="mt-4 text-center">
                <a class="btn btn-primary me-2" th:href="@{/clientes}">Volver a la lista</a>
                <a class="btn btn-warning" th:href="@{'/clientes/editar/' + ${cliente.id}}">Editar cliente</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
