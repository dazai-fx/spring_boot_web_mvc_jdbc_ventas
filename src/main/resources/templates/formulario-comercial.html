<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>[[${pageTitle}]]</title>
  <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
  <style>
    form {
      max-width: 500px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
<div class="container-fluid ">
  <div class="text-center"><h1>[[${pageTitle}]]</h1></div>

  <form th:action="@{/comerciales/guardar}" method="post" th:object="${comercial}">
    <input type="hidden" th:field="*{id}">
    <div class="border border-secondary rounded p-3">
      <div class="form-group row">
        <label for="nombre" class="col-sm-4 col-form-label">Nombre</label>
        <div class="col-sm-8">
          <input class="form-control" type="text" th:field="*{nombre}" id="nombre">
        </div>
      </div>
      <div class="form-group row">
        <label for="apellido1" class="col-sm-4 col-form-label">Apellido 1</label>
        <div class="col-sm-8">
          <input class="form-control" type="text" th:field="*{apellido1}" id="apellido1">
        </div>
      </div>
      <div class="form-group row">
        <label for="apellido2" class="col-sm-4 col-form-label">Apellido 2</label>
        <div class="col-sm-8">
          <input class="form-control" type="text" th:field="*{apellido2}" id="apellido2">
        </div>
      </div>
      <div class="form-group row">
        <label for="comision" class="col-sm-4 col-form-label">comision</label>
        <div class="col-sm-8">
          <input class="form-control" type="number" step="0.01" th:field="*{comision}" id="comision">
        </div>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-primary m-2">Añadir</button>
        <button type="button" class="btn btn-secondary m-2" onclick="cancelForm()">Cancelar</button>
      </div>
    </div>
  </form>
</div>
<script type="text/javascript">
  function cancelForm(){
    window.location = "[[@{/comerciales}]]";
  }
</script>
</body>
</html>
